<!DOCTYPE html>
<html lang="en" data-theme="cyberpunk">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="description" content="A local-first command center for makers, builders, and experimenters.">
<meta name="theme-color" content="#05070d">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles/theme.css">
<link rel="stylesheet" href="./styles/layout.css">
<link rel="stylesheet" href="./styles/components.css">
<link rel="stylesheet" href="./styles/ai.css">
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="brand"><div class="brand-mark">MCC</div><div><div class="brand-name">Maker Command Center</div><div class="brand-sub">local-first build OS</div></div></div>
<nav class="nav">
<a href="#/" data-route="/"><span>◈</span> Mission Control</a>
<a href="#/projects" data-route="/projects"><span>▤</span> Projects</a>
<a href="#/ideas" data-route="/ideas"><span>✦</span> Idea Inbox</a>

<a href="#/tests" data-route="/tests"><span>⚗</span> Test Logs</a>
<a href="#/parts" data-route="/parts"><span>⚙</span> Parts</a>
<a href="#/references" data-route="/references"><span>⌘</span> References</a>

</nav>

<div class="ai-status" id="aiStatus">AI: not configured</div>
</div>
</aside>

<input id="globalSearch" class="search" type="search" placeholder="Search missions, tasks, builds, tests, parts…" autocomplete="off">

</header>
<section id="view" class="view" aria-live="polite"></section>

</div>
<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>
<script type="module" src="./js/main.js"></script>

</html>
